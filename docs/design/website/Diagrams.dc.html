<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    const figs = Array.from(document.querySelectorAll('[data-fig]'));
    if (!('IntersectionObserver' in window)) { figs.forEach(f => f.classList.add('in')); return; }
    this._io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); this._io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    figs.forEach(f => this._io.observe(f));
    this._t = setTimeout(() => figs.forEach(f => f.classList.add('in')), 4000);
  }
  componentWillUnmount() {
    if (this._io) this._io.disconnect();
    if (this._t) clearTimeout(this._t);
  }
}
</script>
